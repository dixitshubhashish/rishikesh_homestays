# Daily check for the generated stays pages (hotels/). scripts/stays/refresh.py
# decides whether anything is due (gap grows 7 -> 56 days while the source
# listing doesn't change), so most days this exits in seconds.
name: Refresh stays pages

on:
  schedule:
    - cron: '30 0 * * *'   # 06:00 IST daily
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-crawl now, ignoring the gap'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Only needed for the BigQuery snapshot (push_bigquery.mjs).
      - run: npm ci --ignore-scripts
      - run: python3 scripts/stays/refresh.py ${{ inputs.force && '--force' || '' }}
        env:
          # Optional repo secret (Settings → Secrets → Actions): the same service-account
          # JSON as Vercel's GOOGLE_APPLICATION_CREDENTIALS_JSON. Without it the
          # BigQuery snapshot step just skips.
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      # The stays pages' text templates for in-browser translation (docs/I18N.md): new
      # English templates show in English until they are translated (npm run i18n:status).
      - run: npm run --silent build:i18n
      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "stays-refresh bot"
          git config user.email "actions@users.noreply.github.com"
          # the pages now live in hotels/; the build also rewrites every footer, sitemap.xml,
          # llms.txt / llms-full.txt and the honest page dates (scripts/stays/page-dates.tsv)
          git add -A -- scripts/stays assets/js/modules hotels sitemap.xml llms.txt llms-full.txt '*.html' i18n
          git diff --cached --quiet && exit 0
          git commit -m "Stays pages: scheduled refresh ($(date -u +%F))"
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"
      # A push made with this workflow's token does not start other workflows, so the
      # IndexNow ping (indexnow.yml) runs here: the pages whose date moved, once live.
      - name: IndexNow
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: |
          git diff --quiet HEAD~1 HEAD -- sitemap.xml && exit 0
          node scripts/indexnow.mjs --from HEAD~1 --wait-live
